<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Security Headers: CSP and Referrer Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss: ws:; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:;" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Document Metadata & OpenGraph Context -->
    <meta name="description" content="Deep PII and Secret Scanner for GitHub repositories." />
    <meta property="og:title" content="Git Secret & PII Sanitizer" />
    <meta property="og:description" content="Deep PII and Secret Scanner for GitHub repositories." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#090a0f" />
    <title>Git Secret & PII Sanitizer</title>
    
    <!-- Performance Optimizations: DNS Resolution and Preconnection -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" />
    
    <!-- Critical Rendering Path Preload -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-500 selection:text-white">
    <!-- Application Root Mount Point -->
    <div 
      id="root" 
      role="application" 
      aria-label="Git Secret and PII Sanitizer Interface" 
      class="min-h-screen flex flex-col"
    ></div>
    
    <!-- Core Application Entrypoint Script -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
